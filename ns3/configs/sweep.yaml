# Sweep config: 30 traces × 3 ABR × 2 cache policies
traces_index: "ns3/configs/traceset_norway.csv"   # generated by datasets/ingest_dataset.py (copy/sync if needed)
num_traces: 30
abrs: ["BOLA", "MPC", "Pensive"]
cache_policies: ["lru", "nocache"]
